<!DOCTYPE html>

<!-- A NOTE TO STUDENTS: you can safely ignore this file, and everything else in this directory. It changes the styling of rendered pages from this repository when the page is embedded in a Canvas page. If you're interested, the key parts are what's in the `script` tag in the `head` section, and the `style` tag below that. The `script` tag contains a piece of JavaScript that detects whether the page is being displayed embedded. If it is, it marks the document as 'embedded'. The `style` tag below it contains an instruction to not make a link back to the course GitHub when displaying documents marked as 'embedded'. This link doesn't make sense in the context of a Canvas page, which is why I've suppressed it.
-->

<html lang="{{ page.lang | default: site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>
      if (window.self !== window.top) {
        document.documentElement.classList.add('embedded');
      }
    </script>
    <style>
      .embedded .site-title { display: none; }
    </style>

{% seo %}
    <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
    {% include head-custom.html %}
  </head>
  <body>
    <div class="container-lg px-3 my-5 markdown-body">
      {% if site.title and site.title != page.title %}
      <h1><a href="{{ "/" | absolute_url }}">{{ site.title }}</a></h1>
      {% endif %}

      {{ content }}

      {% if site.github.private != true and site.github.license %}
      <div class="footer border-top border-gray-light mt-5 pt-3 text-right text-gray">
        This site is open source. {% github_edit_link "Improve this page" %}.
      </div>
      {% endif %}
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/anchor-js/4.1.0/anchor.min.js" integrity="sha256-lZaRhKri35AyJSypXXs4o6OPFTbTmUoltBbDCbdzegg=" crossorigin="anonymous"></script>
    <script>anchors.add();</script>
  </body>
</html>
